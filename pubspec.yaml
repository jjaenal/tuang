name: tuang
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.30.1
  shared_preferences: ^2.5.3
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  google_mobile_ads: ^5.0.0
  flame_audio: ^2.11.8
  url_launcher: ^6.3.0
  supabase_flutter: ^2.4.6
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.3.10
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/bird.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/bird.png
  macos:
    generate: true
    image_path: assets/images/bird.png
  windows:
    generate: true
    image_path: assets/images/bird.png

flutter_native_splash:
  color: "#1A1A1A"
  image: assets/images/bird.png
  web: true
  android: true
  ios: true
  android_12:
    color: "#1A1A1A"
    image: assets/images/bird.png
